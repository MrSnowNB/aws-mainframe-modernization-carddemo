services:
  harness:
    build:
      context: .
      dockerfile: app/harness/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_ENDPOINT=http://host.docker.internal:13305/v1
      - INFERENCE_MODEL=Qwen3.6-35B-A3B-GGUF
      - INFERENCE_API_KEY=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/cbl:/app/app/cbl:ro
      - ./scripts:/app/scripts
      - ./validation:/app/validation
      - harness_sessions:/app/securatron/sessions

volumes:
  harness_sessions:
