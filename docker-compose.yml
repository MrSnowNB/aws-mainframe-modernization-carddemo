services:
  harness:
    build:
      context: .
      dockerfile: app/harness/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_ENDPOINT=http://172.17.0.1:13305/v1
      - INFERENCE_MODEL=Qwen3-0.6B-GGUF
      - INFERENCE_API_KEY=
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/cbl:/app/app/cbl:ro
      - ./scripts:/app/scripts
      - ./validation:/app/validation
      - ./app/securatron:/app/securatron
      - harness_sessions:/app/securatron/sessions

volumes:
  harness_sessions:
